name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache the fixture mirror
        uses: actions/cache@v4
        with:
          path: tests/fixtures/mirror
          key: nci-fixture-mirror-${{ hashFiles('tests/fixtures/manifest.txt') }}
      - name: Fetch the fixture mirror from the public buckets
        run: python tests/fixtures/fetch_mirror.py
      - name: Install + test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q -rs

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mypy src/scigantic_nci
